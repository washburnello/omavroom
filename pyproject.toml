[project]
name = "omavroom"
version = "0.0.1"
description = "Disposable-VM seat manager for coding agents (Omarchy + VM + room)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.scripts]
omavroom = "omavroom.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real libvirt, golden images and ~/.ssh seat key; opt in with OMAVROOM_INTEGRATION=1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omavroom"]
